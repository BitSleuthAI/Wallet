  # Enable version updates for Android Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "android"
      - "native"
    commit-message:
      prefix: "chore(deps-android)"
      include: "scope"
