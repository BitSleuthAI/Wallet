# Dependabot configuration for automated dependency updates
# Simplified configuration to prevent timeouts on React Native + Expo projects
# Focus on security updates and critical package grouping only

version: 2
updates:
  # Enable version updates for npm (JavaScript/TypeScript dependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Reduced from 5 to 3 to limit concurrent update attempts
    open-pull-requests-limit: 3
    # Simplified grouping - only group packages that MUST be updated together
    groups:
      # Group only core Expo SDK packages that require synchronized updates
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
        update-types:
          - "minor"
          - "patch"
    # Automatic security updates
    allow:
      - dependency-type: "all"
    # Ignore packages that cause timeouts or have known issues
    ignore:
      # Development tool - can be updated manually
      - dependency-name: "expo-mcp"
      # These packages can cause long resolution times - handle manually
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "babel-*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
    # Maintain compatibility with existing package manager
    versioning-strategy: increase
    # Labels for easier tracking
    labels:
      - "dependencies"
      - "npm"
    # Commit message prefix
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Enable version updates for Android Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "android"
      - "native"
    commit-message:
      prefix: "chore(deps-android)"
      include: "scope"
