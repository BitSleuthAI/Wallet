# Dependabot configuration for automated dependency updates
# This ensures security vulnerabilities are caught and patched quickly
# Configured for React Native + Expo mobile app

version: 2
updates:
  # Enable version updates for npm (JavaScript/TypeScript dependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Group minor and patch updates to reduce PR noise
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group Expo SDK packages together - they must be updated in sync
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
        update-types:
          - "minor"
          - "patch"
      # Group React Native Firebase packages together
      react-native-firebase:
        patterns:
          - "@react-native-firebase/*"
        update-types:
          - "minor"
          - "patch"
      # Group Babel packages together
      babel:
        patterns:
          - "@babel/*"
          - "babel-*"
        update-types:
          - "minor"
          - "patch"
      # Group Bitcoin protocol packages together
      bitcoin:
        patterns:
          - "bitcoinjs-lib"
          - "bip32"
          - "bip39"
          - "@scure/bip32"
          - "react-native-bip32-utils"
          - "@noble/*"
          - "tiny-secp256k1"
          - "bech32"
          - "bs58check"
        update-types:
          - "minor"
          - "patch"
    # Automatic security updates
    allow:
      - dependency-type: "all"
    # Maintain compatibility with existing package manager
    versioning-strategy: increase
    # Labels for easier tracking
    labels:
      - "dependencies"
      - "npm"
    # Commit message prefix
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Enable version updates for Android Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"
      - "native"
    commit-message:
      prefix: "chore(deps-android)"
      include: "scope"
